  <path d="M80 72 Q88 70 93 73" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
  <path d="M107 73 Q112 70 120 72" fill="none" stroke="#0f172a" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="86" cy="82" r="3.5" fill="#0f172a" />
  <circle cx="114" cy="82" r="3.5" fill="#0f172a" />
  <!-- Nose -->
  <path d="M100 80 L98 94 L104 94" fill="none" stroke="#dd6b20" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
  <!-- Gentle Smile -->
  <path d="M90 104 Q100 114 110 104" fill="none" stroke="#c05621" stroke-width="2.5" stroke-linecap="round" />
  <!-- Coat Collar -->
  <path d="M68 140 L88 170 L100 140 L112 170 L132 140" fill="none" stroke="#cbd5e1" stroke-width="2" />
