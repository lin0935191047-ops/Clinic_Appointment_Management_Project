<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-an" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="100%" stop-color="#115e59" />
    </linearGradient>
    <linearGradient id="skin-an" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbd38d" />
      <stop offset="100%" stop-color="#f6ad55" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg-an)" />
  <!-- Shoulders & Coat -->
  <path d="M40 200 C40 150 70 140 100 140 C130 140 160 150 160 200 Z" fill="#ffffff" />
  <!-- Inner shirt & tie -->
  <path d="M88 140 L100 170 L112 140 Z" fill="#0284c7" />
  <path d="M96 150 L100 185 L104 150 Z" fill="#0369a1" />
  <!-- Neck -->
  <rect x="88" y="115" width="24" height="30" rx="4" fill="url(#skin-an)" />
  <!-- Stethoscope -->
  <path d="M72 142 C72 175 88 185 100 185 C112 185 128 175 128 142" fill="none" stroke="#475569" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="100" cy="186" r="6" fill="#94a3b8" stroke="#475569" stroke-width="2" />
  <!-- Head & Ears -->
  <circle cx="68" cy="85" r="9" fill="url(#skin-an)" />
  <circle cx="132" cy="85" r="9" fill="url(#skin-an)" />
  <ellipse cx="100" cy="85" rx="32" ry="38" fill="url(#skin-an)" />
  <!-- Hair (Short Male) -->
  <path d="M68 75 C68 45 80 40 100 40 C120 40 132 45 132 75 C125 58 115 52 100 52 C85 52 75 58 68 75 Z" fill="#1e293b" />
