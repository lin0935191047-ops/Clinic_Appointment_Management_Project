  <path d="M70 140 C70 175 88 186 100 186 C112 186 130 175 130 140" fill="none" stroke="#334155" stroke-width="4.5" stroke-linecap="round" />
  <circle cx="100" cy="188" r="6.5" fill="#e2e8f0" stroke="#0f172a" stroke-width="2.5" />
  <!-- Head & Ears -->
  <circle cx="67" cy="85" r="9" fill="url(#skin-nam)" />
  <circle cx="133" cy="85" r="9" fill="url(#skin-nam)" />
  <ellipse cx="100" cy="85" rx="33" ry="38" fill="url(#skin-nam)" />
