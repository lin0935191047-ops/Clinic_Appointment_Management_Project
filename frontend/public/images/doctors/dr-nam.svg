<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-nam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e3a8a" />
    </linearGradient>
    <linearGradient id="skin-nam" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fba866" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg-nam)" />
  <!-- Shoulders & Coat -->
  <path d="M40 200 C40 152 70 140 100 140 C130 140 160 152 160 200 Z" fill="#ffffff" />
  <!-- Inner shirt & Red Cardiology Tie -->
  <path d="M88 140 L100 172 L112 140 Z" fill="#f8fafc" />
  <path d="M96 150 L100 188 L104 150 Z" fill="#dc2626" />
