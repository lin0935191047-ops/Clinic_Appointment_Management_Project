  <path d="M67 76 C67 44 80 38 100 38 C120 38 133 44 133 76 C124 54 114 48 98 48 C82 48 74 54 67 76 Z" fill="#334155" />
  <path d="M72 58 C85 50 110 50 128 58" fill="none" stroke="#94a3b8" stroke-width="2" />
  <!-- Eyebrows -->
  <path d="M78 70 Q86 68 94 71" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <path d="M106 71 Q114 68 122 70" fill="none" stroke="#1e293b" stroke-width="2.5" stroke-linecap="round" />
  <!-- Glasses (Doctor Specialist) -->
  <rect x="76" y="74" width="20" height="15" rx="4" fill="none" stroke="#1e293b" stroke-width="2.2" />
  <rect x="104" y="74" width="20" height="15" rx="4" fill="none" stroke="#1e293b" stroke-width="2.2" />
  <path d="M96 80 L104 80" stroke="#1e293b" stroke-width="2" />
  <path d="M68 78 L76 78" stroke="#1e293b" stroke-width="2" />
  <path d="M124 78 L132 78" stroke="#1e293b" stroke-width="2" />
  <!-- Eyes behind glasses -->
  <circle cx="86" cy="82" r="3" fill="#0f172a" />
  <circle cx="114" cy="82" r="3" fill="#0f172a" />
  <!-- Nose -->
  <path d="M100 80 L98 94 L104 94" fill="none" stroke="#c2410c" stroke-width="2" stroke-linecap="round" />
  <!-- Confident Smile -->
  <path d="M91 105 Q100 113 109 105" fill="none" stroke="#9a3412" stroke-width="2.5" stroke-linecap="round" />
  <!-- Coat Collar -->
