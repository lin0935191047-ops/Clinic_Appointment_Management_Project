<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-trang" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#6b21a8" />
    </linearGradient>
    <linearGradient id="skin-trang" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg-trang)" />
  <!-- Ponytail / High Bun -->
  <circle cx="100" cy="38" r="14" fill="#1e1b4b" />
  <!-- Shoulders & Coat -->
  <path d="M42 200 C42 154 72 142 100 142 C128 142 158 154 158 200 Z" fill="#ffffff" />
  <!-- Inner shirt (Lavender) -->
  <path d="M88 142 L100 170 L112 142 Z" fill="#e9d5ff" />
  <!-- Neck -->
  <rect x="90" y="115" width="20" height="28" rx="4" fill="url(#skin-trang)" />
  <!-- Stethoscope (Purple/Medical) -->
  <path d="M74 142 C74 175 88 185 100 185 C112 185 126 175 126 142" fill="none" stroke="#7e22ce" stroke-width="4" stroke-linecap="round" />
  <circle cx="100" cy="186" r="6" fill="#c084fc" stroke="#6b21a8" stroke-width="2" />
  <!-- Head & Ears -->
  <circle cx="70" cy="85" r="8" fill="url(#skin-trang)" />
  <circle cx="130" cy="85" r="8" fill="url(#skin-trang)" />
  <ellipse cx="100" cy="85" rx="30" ry="36" fill="url(#skin-trang)" />
  <!-- Hair (Sleek Updo) -->
  <path d="M68 76 C66 48 80 44 100 44 C120 44 134 48 132 76 C124 58 114 54 100 54 C86 54 76 58 68 76 Z" fill="#1e1b4b" />
  <!-- Eyes & Eyebrows -->
  <path d="M80 73 Q88 70 92 73" fill="none" stroke="#1e1b4b" stroke-width="2.2" stroke-linecap="round" />
  <path d="M108 73 Q112 70 120 73" fill="none" stroke="#1e1b4b" stroke-width="2.2" stroke-linecap="round" />
  <circle cx="86" cy="82" r="3.5" fill="#1e1b4b" />
  <circle cx="114" cy="82" r="3.5" fill="#1e1b4b" />
  <circle cx="88" cy="80" r="1.2" fill="#ffffff" />
  <circle cx="116" cy="80" r="1.2" fill="#ffffff" />
  <!-- Cheeks Blush -->
  <circle cx="78" cy="92" r="5" fill="#f472b6" opacity="0.4" />
  <circle cx="122" cy="92" r="5" fill="#f472b6" opacity="0.4" />
  <!-- Nose -->
  <path d="M100 82 L98 92 L103 92" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" />
  <!-- Gentle Smile -->
  <path d="M91 103 Q100 113 109 103" fill="none" stroke="#9333ea" stroke-width="2.2" stroke-linecap="round" />
  <!-- Small Pearl Earrings -->
  <circle cx="68" cy="88" r="2.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5" />
  <circle cx="132" cy="88" r="2.5" fill="#f8fafc" stroke="#cbd5e1" stroke-width="0.5" />
  <!-- Coat Collar -->
  <path d="M72 142 L88 170 L100 142 L112 170 L128 142" fill="none" stroke="#e2e8f0" stroke-width="2" />
</svg>
