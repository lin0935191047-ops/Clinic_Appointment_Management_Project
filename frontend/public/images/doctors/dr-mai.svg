<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-mai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#be123c" />
    </linearGradient>
    <linearGradient id="skin-mai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa" />
      <stop offset="100%" stop-color="#fdba74" />
    </linearGradient>
  </defs>
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="100" fill="url(#bg-mai)" />
  <!-- Hair back (Long Female) -->
  <path d="M58 80 C55 120 60 160 70 180 C80 160 85 120 85 80 Z" fill="#332211" />
  <path d="M142 80 C145 120 140 160 130 180 C120 160 115 120 115 80 Z" fill="#332211" />
  <!-- Shoulders & Coat -->
  <path d="M42 200 C42 155 72 142 100 142 C128 142 158 155 158 200 Z" fill="#ffffff" />
  <!-- Inner shirt (Pink/Pastel) -->
  <path d="M88 142 L100 170 L112 142 Z" fill="#fda4af" />
  <!-- Neck -->
  <rect x="90" y="115" width="20" height="28" rx="4" fill="url(#skin-mai)" />
  <!-- Stethoscope (Friendly Coral Pink) -->
  <path d="M74 142 C74 175 88 185 100 185 C112 185 126 175 126 142" fill="none" stroke="#e11d48" stroke-width="4" stroke-linecap="round" />
  <circle cx="100" cy="186" r="6" fill="#fb7185" stroke="#be123c" stroke-width="2" />
  <!-- Head & Ears -->
  <circle cx="70" cy="85" r="8" fill="url(#skin-mai)" />
  <circle cx="130" cy="85" r="8" fill="url(#skin-mai)" />
  <ellipse cx="100" cy="85" rx="30" ry="36" fill="url(#skin-mai)" />
  <!-- Hair Front (Friendly bangs) -->
  <path d="M68 78 C65 48 80 42 100 42 C120 42 135 48 132 78 C126 62 118 56 100 56 C82 56 74 62 68 78 Z" fill="#451a03" />
  <path d="M70 60 Q100 70 130 60" fill="#451a03" />
  <!-- Eyes & Smiling Eyebrows -->
  <path d="M80 74 Q88 71 92 74" fill="none" stroke="#451a03" stroke-width="2" stroke-linecap="round" />
  <path d="M108 74 Q112 71 120 74" fill="none" stroke="#451a03" stroke-width="2" stroke-linecap="round" />
  <circle cx="86" cy="82" r="3.5" fill="#451a03" />
  <circle cx="114" cy="82" r="3.5" fill="#451a03" />
  <circle cx="88" cy="80" r="1" fill="#ffffff" />
  <circle cx="116" cy="80" r="1" fill="#ffffff" />
  <!-- Cheeks Blush -->
  <circle cx="78" cy="92" r="5" fill="#fda4af" opacity="0.6" />
  <circle cx="122" cy="92" r="5" fill="#fda4af" opacity="0.6" />
  <!-- Nose -->
  <path d="M100 82 L98 92 L103 92" fill="none" stroke="#ea580c" stroke-width="1.8" stroke-linecap="round" />
  <!-- Happy Smile -->
  <path d="M91 102 Q100 114 109 102" fill="none" stroke="#be123c" stroke-width="2.5" stroke-linecap="round" />
  <!-- Coat Collar -->
  <path d="M72 142 L88 170 L100 142 L112 170 L128 142" fill="none" stroke="#e2e8f0" stroke-width="2" />
</svg>
