# HTTP SERVER: Tự động Redirect 100% sang HTTPS (Port 80 -> Port 443)
server {
    listen 80;
    listen [::]:80;
    server_name _;

    # Bắt buộc chuyển hướng toàn bộ traffic sang HTTPS với mã 301 Moved Permanently
    location / {
        return 301 https://$host$request_uri;
    }

    # Endpoint probe ACME challenge (Let's Encrypt SSL renewal)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# HTTPS SERVER: SSL/TLS Termination, HSTS, Security Headers & Reverse Proxy
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # SSL Certificates (Tự sinh self-signed hoặc chứng chỉ Let's Encrypt)
    ssl_certificate /etc/nginx/ssl/clinic.crt;
    ssl_certificate_key /etc/nginx/ssl/clinic.key;

    # SSL Protocols & Ciphers an toàn theo khuyến nghị Mozilla Modern/Intermediate
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # HTTP Strict Transport Security (HSTS) - Bắt buộc trình duyệt chỉ dùng HTTPS trong 1 năm
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # Security Headers bảo vệ chống clickjacking, MIME sniffing, XSS
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Giới hạn kích thước body upload
    client_max_body_size 10M;

    # 1. Reverse Proxy tới Backend ASP.NET Core Web API
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection keep-alive;
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_set_header X-Correlation-ID $http_x_correlation_id;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # 2. Reverse Proxy tới Health Check probe
    location /health {
        proxy_pass http://backend:8080/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 3. Reverse Proxy tới Swagger UI (chỉ cho phép nếu bật Swagger ở production hoặc internal)
    location /swagger {
        proxy_pass http://backend:8080/swagger;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 4. Phục vụ Frontend React SPA
    location / {
        proxy_pass http://frontend:80/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
