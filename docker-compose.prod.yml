services:
  # ==============================================================================
  # 1. DATABASE: PostgreSQL 16 (Không expose port ra ngoài, chỉ nội bộ container)
  # ==============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: clinic_prod_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ClinicAppointmentDb}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Vui lòng cấu hình POSTGRES_PASSWORD trong file .env}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
      - ./database/backups:/backups
    networks:
      - clinic_internal_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ClinicAppointmentDb}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==============================================================================
  # 2. BACKEND: ASP.NET Core 8 Web API
  # ==============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: clinic_prod_backend
    restart: always
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      DB_CONNECTION_STRING: "Host=postgres;Port=5432;Database=${POSTGRES_DB:-ClinicAppointmentDb};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD};"
      JwtSettings__SecretKey: ${JWT_SECRET_KEY:?Vui lòng cấu hình JWT_SECRET_KEY trong file .env}
      JwtSettings__Issuer: ${JWT_ISSUER:-ClinicAppointmentApi}
      JwtSettings__Audience: ${JWT_AUDIENCE:-ClinicAppointmentClient}
      JwtSettings__AccessTokenExpirationMinutes: ${JWT_ACCESS_TOKEN_EXPIRATION_MINUTES:-30}
      JwtSettings__RefreshTokenExpirationDays: ${JWT_REFRESH_TOKEN_EXPIRATION_DAYS:-7}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY:?Vui lòng cấu hình PII_ENCRYPTION_KEY}
      HMAC_SECRET_KEY: ${HMAC_SECRET_KEY:?Vui lòng cấu hình HMAC_SECRET_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - clinic_internal_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ==============================================================================
  # 3. FRONTEND: React SPA (Nginx Serving Assets)
  # ==============================================================================
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: clinic_prod_frontend
    restart: always
    networks:
      - clinic_internal_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:80/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3

  # ==============================================================================
  # 4. REVERSE PROXY & SSL GATEWAY: Nginx (Cổng vào duy nhất của hệ thống)
  # ==============================================================================
  nginx:
    image: nginx:1.27-alpine
    container_name: clinic_prod_nginx
    restart: always
    ports:
      - "80:80"     # HTTP (tự động redirect sang HTTPS 301)
      - "443:443"   # HTTPS (SSL/TLS termination)
    volumes:
      - ./deployment/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./deployment/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deployment/ssl:/etc/nginx/ssl:ro
      - ./deployment/certbot/www:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
    networks:
      - clinic_internal_network

networks:
  clinic_internal_network:
    driver: bridge

volumes:
  postgres_prod_data:
    driver: local
