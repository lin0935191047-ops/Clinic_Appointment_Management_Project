services:
  # 1. Backend Web API (.NET 8 Docker)
  - type: web
    name: clinic-backend-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: .
    plan: free
    region: singapore
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: AUTO_MIGRATE
        value: "true"
      - key: ENABLE_SWAGGER
        value: "true"
      - key: PORT
        value: "8080"
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ConnectionStrings__DefaultConnection
        fromDatabase:
          name: clinic-postgres
          property: connectionString
      - key: BankQR__BankId
        value: TCB
      - key: BankQR__AccountNumber
        value: "19038779759014"
      - key: BankQR__AccountName
        value: "LE HUYNH PHUONG ANH"
      - key: BankQR__Template
        value: compact2
      - key: BankQR__StaticQrUrl
        value: "/images/qr/techcombank-qr-clean.png"

databases:
  # 2. Managed PostgreSQL Database (Render Free Tier)
  - name: clinic-postgres
    databaseName: clinicappointmentdb
    user: clinicuser
    plan: free
    region: singapore
    postgresMajorVersion: 16
